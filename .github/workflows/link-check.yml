name: Link Check
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * 1'  # weekly on Monday at 08:00 UTC

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --accept 200,201,202,203,206,301,302,307,308,429
            --exclude 'https://www.webpagetest.org/'
            --retry-wait-time 5
            --max-retries 3
            --timeout 30
            --user-agent "Mozilla/5.0 (compatible; Lychee/awesome-browser)"
            'README.md'
            'CONTRIBUTING.md'
            'CODE_OF_CONDUCT.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
